<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>このサイトについて - JIRO HUB</title>
  <link rel="icon" href="icon.jpg" type="image/jpeg">

  <style>
    :root {
      --bg-main: #0a0a0a;
      --card-bg: #141414;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --accent-orange: #ff6b00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-main);
    }

    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    main {
      flex: 1;
      padding: 40px 24px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .content-box {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--accent-orange);
      padding-bottom: 8px;
    }

    p {
      line-height: 1.8;
      color: #d1d1d1;
      margin-bottom: 16px;
    }

    p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="header-group">
    <div class="top-bar">
      <a href="about.html">このサイトについて</a>
      <a href="disclaimer.html">免責事項</a>
    </div>
    <header>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">JIRO<span>HUB</span></span>
      </a>
    </header>
  </div>

  <main>
    <div class="content-box">
      <h1>このサイトについて</h1>
      <p>
        JIRO HUB（ジローハブ）は、作業や学習の効率を高めるためのWebツールやコンテンツを集約したポータルサイトです。
      </p>
      <p>
        ポモドーロタイマーをはじめとする生産性向上ツールを提供し、シンプルで集中しやすい環境づくりをサポートします。
      </p>
      <p>
        自由に使ってくれ
      </p>
      <p>
        よろしく(26/08/01)
      </p>
    </div>
  </main>

</body>
</html>
