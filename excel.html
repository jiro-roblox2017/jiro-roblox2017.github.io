<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - 9教科 テスト成績管理</title>
  
  <!-- タブアイコン設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-main: #0a0a0a;          /* 極黒ダーク背景 */
      --card-bg: #141414;
      --card-hover: #1f1f1f;
      --text-main: #ffffff;        /* 完全な白文字 */
      --text-sub: #a0a0a0;         /* 補足用グレー文字 */
      --accent-orange: #ff6b00;    /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
      --accent-green: #2ecc71;
      --accent-blue: #3498db;
      --accent-red: #e74c3c;
      --border-color: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-main);
    }

    /* 固定ヘッダーグループ */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* メインコンテンツ */
    main {
      padding: 24px 16px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* タイトル & 集計対象切り替えバー */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      background-color: var(--card-bg);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .test-title-input {
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent-orange);
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: bold;
      padding: 4px 8px;
      outline: none;
      min-width: 200px;
    }

    .mode-switch-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mode-label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .toggle-btn.active-self {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    .toggle-btn.active-final {
      background: var(--accent-green);
      color: #000000;
      border-color: var(--accent-green);
    }

    /* サマリーカード（合計・平均） */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .summary-card.highlight {
      border-color: var(--accent-orange);
    }

    .summary-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .summary-unit {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    /* 成績入力テーブル */
    .table-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      min-width: 650px;
    }

    th {
      background-color: rgba(0, 0, 0, 0.4);
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .subject-name {
      font-weight: bold;
      text-align: left;
      padding-left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-5 {
      background-color: rgba(255, 107, 0, 0.15);
      color: var(--accent-orange);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent-orange);
    }

    .badge-4 {
      background-color: rgba(52, 152, 219, 0.15);
      color: var(--accent-blue);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent-blue);
    }

    /* 点数入力・内訳エリア */
    .score-input {
      width: 75px;
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 6px 8px;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .score-input:focus {
      border-color: var(--accent-orange);
      background-color: rgba(255, 255, 255, 0.12);
    }

    /* 技術・家庭専用の分割入力レイアウト */
    .tech-home-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .sub-input-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .sub-input-row input {
      width: 55px;
      padding: 4px;
      font-size: 0.85rem;
    }

    .tech-home-total {
      font-weight: bold;
      color: var(--accent-orange);
      font-size: 1rem;
    }

    .diff-text {
      font-size: 0.85rem;
      font-weight: bold;
    }

    .diff-plus { color: var(--accent-green); }
    .diff-minus { color: var(--accent-red); }
    .diff-zero { color: var(--text-sub); }

    /* 操作ボタン */
    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: rgba(231, 76, 60, 0.2);
      color: var(--accent-red);
      border-color: var(--accent-red);
    }
  </style>
</head>
<body>

  <!-- 全ページ共通ヘッダーグループ -->
  <div class="header-group">
    <div class="top-bar">
      <a href="about.html">このサイトについて</a>
      <a href="disclaimer.html">免責事項</a>
    </div>

    <header>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">JIRO<span>HUB</span></span>
      </a>
    </header>
  </div>

  <main>
    <!-- タイトル設定＆表示モード切替 -->
    <div class="top-controls">
      <div>
        <input type="text" id="testTitle" class="test-title-input" value="定期テスト 結果" oninput="saveData()">
      </div>
      <div class="mode-switch-group">
        <span class="mode-label">集計基準:</span>
        <button class="toggle-btn active-self" id="modeSelfBtn" onclick="setMode('self')">自己採点</button>
        <button class="toggle-btn" id="modeFinalBtn" onclick="setMode('final')">確定点数（返却）</button>
      </div>
    </div>

    <!-- サマリー（集計結果） -->
    <div class="summary-grid">
      <div class="summary-card highlight">
        <div class="summary-title" id="summary5Title">5教科 合計 (自己採点)</div>
        <div class="summary-value" id="total5Score">0 <span class="summary-unit">/ 500</span></div>
      </div>
      <div class="summary-card">
        <div class="summary-title" id="summary5AvgTitle">5教科 平均 (自己採点)</div>
        <div class="summary-value" id="avg5Score">0.0 <span class="summary-unit">点</span></div>
      </div>
      <div class="summary-card highlight">
        <div class="summary-title" id="summary9Title">9教科 合計 (自己採点)</div>
        <div class="summary-value" id="total9Score">0 <span class="summary-unit">/ 900</span></div>
      </div>
      <div class="summary-card">
        <div class="summary-title" id="summary9AvgTitle">9教科 平均 (自己採点)</div>
        <div class="summary-value" id="avg9Score">0.0 <span class="summary-unit">点</span></div>
      </div>
    </div>

    <!-- 点数入力テーブル -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>教科</th>
            <th>目標点</th>
            <th>自己採点</th>
            <th>確定点数（返却）</th>
            <th>差分 (確定 - 自己)</th>
          </tr>
        </thead>
        <tbody id="scoreTableBody">
          <!-- JSで自動生成 -->
        </tbody>
      </table>
    </div>

    <!-- データ管理ボタン -->
    <div class="bottom-actions">
      <button class="action-btn" onclick="clearData()">すべてのデータをリセット</button>
    </div>
  </main>

  <script>
    const subjects = [
      { id: 'english', name: '英語', group: 5 },
      { id: 'math', name: '数学', group: 5 },
      { id: 'japanese', name: '国語', group: 5 },
      { id: 'science', name: '理科', group: 5 },
      { id: 'social', name: '社会', group: 5 },
      { id: 'music', name: '音楽', group: 4 },
      { id: 'art', name: '美術', group: 4 },
      { id: 'pe', name: '保健体育', group: 4 },
      { id: 'tech_home', name: '技術・家庭', group: 4, isSplit: true }
    ];

    let activeMode = 'self';

    function initTable() {
      const tbody = document.getElementById('scoreTableBody');
      tbody.innerHTML = '';

      subjects.forEach(sub => {
        const row = document.createElement('tr');
        const badge = sub.group === 5 ? `<span class="badge-5">5教科</span>` : `<span class="badge-4">実技</span>`;

        if (sub.isSplit) {
          row.innerHTML = `
            <td class="subject-name">${badge} ${sub.name}</td>
            <td>
              <div class="tech-home-wrapper">
                <div class="sub-input-row">技:<input type="number" class="score-input" id="target_tech_${sub.id}" min="0" max="50" placeholder="-" oninput="onScoreChange()"></div>
                <div class="sub-input-row">家:<input type="number" class="score-input" id="target_home_${sub.id}" min="0" max="50" placeholder="-" oninput="onScoreChange()"></div>
                <div class="tech-home-total">計: <span id="target_total_${sub.id}">-</span></div>
              </div>
            </td>
            <td>
              <div class="tech-home-wrapper">
                <div class="sub-input-row">技:<input type="number" class="score-input" id="self_tech_${sub.id}" min="0" max="50" placeholder="-" oninput="onScoreChange()"></div>
                <div class="sub-input-row">家:<input type="number" class="score-input" id="self_home_${sub.id}" min="0" max="50" placeholder="-" oninput="onScoreChange()"></div>
                <div class="tech-home-total">計: <span id="self_total_${sub.id}">-</span></div>
              </div>
            </td>
            <td>
              <div class="tech-home-wrapper">
                <div class="sub-input-row">技:<input type="number" class="score-input" id="final_tech_${sub.id}" min="0" max="50" placeholder="-" oninput="onScoreChange()"></div>
                <div class="sub-input-row">家:<input type="number" class="score-input" id="final_home_${sub.id}" min="0" max="50" placeholder="-" oninput="onScoreChange()"></div>
                <div class="tech-home-total">計: <span id="final_total_${sub.id}">-</span></div>
              </div>
            </td>
            <td>
              <span class="diff-text" id="diff_${sub.id}">-</span>
            </td>
          `;
        } else {
          row.innerHTML = `
            <td class="subject-name">${badge} ${sub.name}</td>
            <td><input type="number" class="score-input" id="target_${sub.id}" min="0" max="100" placeholder="-" oninput="onScoreChange()"></td>
            <td><input type="number" class="score-input" id="self_${sub.id}" min="0" max="100" placeholder="-" oninput="onScoreChange()"></td>
            <td><input type="number" class="score-input" id="final_${sub.id}" min="0" max="100" placeholder="-" oninput="onScoreChange()"></td>
            <td><span class="diff-text" id="diff_${sub.id}">-</span></td>
          `;
        }
        tbody.appendChild(row);
      });

      loadData();
    }

    function setMode(mode) {
      activeMode = mode;
      const selfBtn = document.getElementById('modeSelfBtn');
      const finalBtn = document.getElementById('modeFinalBtn');

      if (mode === 'self') {
        selfBtn.className = 'toggle-btn active-self';
        finalBtn.className = 'toggle-btn';
      } else {
        selfBtn.className = 'toggle-btn';
        finalBtn.className = 'toggle-btn active-final';
      }

      calculateScores();
      saveData();
    }

    function onScoreChange() {
      calculateScores();
      saveData();
    }

    function getSubjectScore(sub, type) {
      if (sub.isSplit) {
        const tVal = parseFloat(document.getElementById(`${type}_tech_${sub.id}`).value);
        const hVal = parseFloat(document.getElementById(`${type}_home_${sub.id}`).value);
        const hasT = !isNaN(tVal);
        const hasH = !isNaN(hVal);

        if (hasT && hasH) {
          const sum = tVal + hVal;
          document.getElementById(`${type}_total_${sub.id}`).textContent = sum;
          return sum;
        } else if (hasT) {
          document.getElementById(`${type}_total_${sub.id}`).textContent = tVal + '(?)';
          return tVal;
        } else if (hasH) {
          document.getElementById(`${type}_total_${sub.id}`).textContent = hVal + '(?)';
          return hVal;
        } else {
          document.getElementById(`${type}_total_${sub.id}`).textContent = '-';
          return NaN;
        }
      } else {
        return parseFloat(document.getElementById(`${type}_${sub.id}`).value);
      }
    }

    function calculateScores() {
      let total5 = 0;
      let count5 = 0;
      let total9 = 0;
      let count9 = 0;

      subjects.forEach(sub => {
        // 目標・自己採点・確定の小計表示を更新
        getSubjectScore(sub, 'target');
        const selfScore = getSubjectScore(sub, 'self');
        const finalScore = getSubjectScore(sub, 'final');
        const diffEl = document.getElementById(`diff_${sub.id}`);

        if (!isNaN(selfScore) && !isNaN(finalScore)) {
          const diff = finalScore - selfScore;
          if (diff > 0) {
            diffEl.textContent = `+${diff}`;
            diffEl.className = 'diff-text diff-plus';
          } else if (diff < 0) {
            diffEl.textContent = `${diff}`;
            diffEl.className = 'diff-text diff-minus';
          } else {
            diffEl.textContent = `±0`;
            diffEl.className = 'diff-text diff-zero';
          }
        } else {
          diffEl.textContent = '-';
          diffEl.className = 'diff-text';
        }

        const activeScore = getSubjectScore(sub, activeMode);
        if (!isNaN(activeScore)) {
          total9 += activeScore;
          count9++;
          if (sub.group === 5) {
            total5 += activeScore;
            count5++;
          }
        }
      });

      const modeLabelText = activeMode === 'self' ? ' (自己採点)' : ' (確定)';
      document.getElementById('summary5Title').textContent = `5教科 合計${modeLabelText}`;
      document.getElementById('summary5AvgTitle').textContent = `5教科 平均${modeLabelText}`;
      document.getElementById('summary9Title').textContent = `9教科 合計${modeLabelText}`;
      document.getElementById('summary9AvgTitle').textContent = `9教科 平均${modeLabelText}`;

      document.getElementById('total5Score').innerHTML = `${total5} <span class="summary-unit">/ 500</span>`;
      document.getElementById('avg5Score').innerHTML = count5 > 0 ? (total5 / count5).toFixed(1) + ' <span class="summary-unit">点</span>' : '0.0 <span class="summary-unit">点</span>';

      document.getElementById('total9Score').innerHTML = `${total9} <span class="summary-unit">/ 900</span>`;
      document.getElementById('avg9Score').innerHTML = count9 > 0 ? (total9 / count9).toFixed(1) + ' <span class="summary-unit">点</span>' : '0.0 <span class="summary-unit">点</span>';
    }

    function saveData() {
      const data = {
        title: document.getElementById('testTitle').value,
        mode: activeMode,
        scores: {}
      };

      subjects.forEach(sub => {
        if (sub.isSplit) {
          data.scores[sub.id] = {
            target_tech: document.getElementById(`target_tech_${sub.id}`).value,
            target_home: document.getElementById(`target_home_${sub.id}`).value,
            self_tech: document.getElementById(`self_tech_${sub.id}`).value,
            self_home: document.getElementById(`self_home_${sub.id}`).value,
            final_tech: document.getElementById(`final_tech_${sub.id}`).value,
            final_home: document.getElementById(`final_home_${sub.id}`).value
          };
        } else {
          data.scores[sub.id] = {
            target: document.getElementById(`target_${sub.id}`).value,
            self: document.getElementById(`self_${sub.id}`).value,
            final: document.getElementById(`final_${sub.id}`).value
          };
        }
      });

      localStorage.setItem('jirohub_test_scores', JSON.stringify(data));
    }

    function loadData() {
      const saved = localStorage.getItem('jirohub_test_scores');
      if (!saved) return;

      try {
        const data = JSON.parse(saved);
        if (data.title !== undefined) document.getElementById('testTitle').value = data.title;
        if (data.mode) setMode(data.mode);

        if (data.scores) {
          subjects.forEach(sub => {
            const s = data.scores[sub.id];
            if (!s) return;
            if (sub.isSplit) {
              document.getElementById(`target_tech_${sub.id}`).value = s.target_tech || '';
              document.getElementById(`target_home_${sub.id}`).value = s.target_home || '';
              document.getElementById(`self_tech_${sub.id}`).value = s.self_tech || '';
              document.getElementById(`self_home_${sub.id}`).value = s.self_home || '';
              document.getElementById(`final_tech_${sub.id}`).value = s.final_tech || '';
              document.getElementById(`final_home_${sub.id}`).value = s.final_home || '';
            } else {
              document.getElementById(`target_${sub.id}`).value = s.target || '';
              document.getElementById(`self_${sub.id}`).value = s.self || '';
              document.getElementById(`final_${sub.id}`).value = s.final || '';
            }
          });
        }
        calculateScores();
      } catch (e) {
        console.error("データ読込エラー", e);
      }
    }

    function clearData() {
      if (confirm("入力したすべての点数をリセットしますか？")) {
        localStorage.removeItem('jirohub_test_scores');
        document.getElementById('testTitle').value = '定期テスト 結果';
        subjects.forEach(sub => {
          if (sub.isSplit) {
            ['target', 'self', 'final'].forEach(t => {
              document.getElementById(`${t}_tech_${sub.id}`).value = '';
              document.getElementById(`${t}_home_${sub.id}`).value = '';
            });
          } else {
            document.getElementById(`target_${sub.id}`).value = '';
            document.getElementById(`self_${sub.id}`).value = '';
            document.getElementById(`final_${sub.id}`).value = '';
          }
        });
        setMode('self');
      }
    }

    // ページ更新・離脱時の最終強制保存
    window.addEventListener('beforeunload', () => {
      saveData();
    });

    initTable();
  </script>
</body>
</html>
