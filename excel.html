<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - 9教科 テスト成績管理</title>
  
  <!-- タブアイコン設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-main: #0a0a0a;          /* 極黒ダーク背景 */
      --card-bg: #141414;
      --card-hover: #1f1f1f;
      --text-main: #ffffff;        /* 完全な白文字 */
      --text-sub: #a0a0a0;         /* 補足用グレー文字 */
      --accent-orange: #ff6b00;    /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
      --accent-green: #2ecc71;
      --accent-blue: #3498db;
      --accent-red: #e74c3c;
      --border-color: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-main);
    }

    /* 固定ヘッダーグループ */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* メインコンテンツ */
    main {
      padding: 24px 16px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    /* タイトル & 集計対象切り替えバー */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      background-color: var(--card-bg);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .test-title-input {
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent-orange);
      color: var(--text-main);
      font-size: 1.2rem;
      font-weight: bold;
      padding: 4px 8px;
      outline: none;
      min-width: 200px;
    }

    .mode-switch-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mode-label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .toggle-btn.active-self {
      background: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    .toggle-btn.active-final {
      background: var(--accent-green);
      color: #000000;
      border-color: var(--accent-green);
    }

    /* サマリーカード（合計・平均） */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .summary-card.highlight {
      border-color: var(--accent-orange);
    }

    .summary-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .summary-unit {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: normal;
    }

    /* 成績入力テーブル */
    .table-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      min-width: 650px;
    }

    th {
      background-color: rgba(0, 0, 0, 0.4);
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .subject-name {
      font-weight: bold;
      text-align: left;
      padding-left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-5 {
      background-color: rgba(255, 107, 0, 0.15);
      color: var(--accent-orange);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent-orange);
    }

    .badge-4 {
      background-color: rgba(52, 152, 219, 0.15);
      color: var(--accent-blue);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent-blue);
    }

    /* 点数入力・内訳エリア */
    .score-input {
      width: 75px;
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 6px 8px;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .score-input:focus {
      border-color: var(--accent-orange);
      background-color: rgba(255, 255, 255, 0.12);
    }

    /* 技術・家庭専用の分割入力レイアウト */
    .tech-home-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .sub-input-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .sub-input-row input {
      width: 55px;
      padding: 4px;
      font-size: 0.85rem;
    }

    .tech-home-total {
      font-weight: bold;
      color: var(--accent-orange);
      font-size: 1rem;
    }

    .diff-text {
      font-size: 0.85rem;
      font-weight: bold;
    }

    .diff-plus { color: var(--accent-green); }
    .diff-minus { color: var(--accent-red); }
    .diff-zero { color: var(--text-sub); }
