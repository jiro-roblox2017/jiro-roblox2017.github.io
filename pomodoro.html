<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ポモドーロタイマー</title>
  
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-work: #0F2350;          
      --bg-break: #3a1015;         
      --card-bg: #141414;
      --text-main: #ffffff;        
      --text-sub: #a0a0a0;         
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(255, 255, 255, 0.08);
      --accent-orange: #F7971D;    
      --accent-orange-hover: #ff9f2e;
    }

    html:fullscreen,
    html:-webkit-full-screen,
    body:fullscreen,
    body:-webkit-full-screen {
      overflow: hidden !important;
      height: 100vh !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-work);
      transition: background-color 0.8s ease;
    }

    body.break-mode {
      background-color: var(--bg-break);
    }

    /* --- 年齢確認モーダル --- */
    .age-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .age-modal.active {
      display: flex;
    }

    .age-modal-content {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }

    .age-modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .age-modal-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .age-btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .age-btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .age-btn.yes {
      background-color: var(--accent-orange);
      color: #000000;
    }

    .age-btn.no {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .age-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* --- コマンドモード モーダル (67) --- */
    .cmd-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 2500;
      justify-content: center;
      align-items: center;
    }

    .cmd-modal.active {
      display: flex;
    }

    .cmd-content {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-orange);
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }

    .cmd-header {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-orange);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cmd-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-right: 4px;
    }

    .cmd-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cmd-item span.num {
      background: var(--accent-orange);
      color: #000;
      font-weight: bold;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.8rem;
    }

    .cmd-footer {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
    }

    /* --- 固定ヘッダーグループ --- */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a, .qr-trigger-btn {
      color: var(--text-sub);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: inherit;
      padding: 0;
      transition: color 0.2s ease;
    }

    .top-bar a:hover, .qr-trigger-btn:hover {
      color: var(--text-main);
    }

    .qr-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }

    .qr-modal.active {
      display: flex;
    }

    .qr-modal-content {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .qr-modal-content img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .qr-close-btn {
      background: var(--accent-orange);
      color: #000;
      border: none;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .qr-close-btn:hover {
      opacity: 0.85;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* --- セクション1：タイマーエリア --- */
    .timer-section {
      min-height: calc(100vh - 84px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      text-align: center;
    }

    .status {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .timer {
      font-size: 6.5rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2.5rem;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .btn-row {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button, .link-btn {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.75rem 2.2rem;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    button:hover, .link-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-orange);
      transform: translateY(-2px);
    }

    .fs-btn {
      font-size: 0.85rem;
      padding: 0.4rem 1.2rem;
      color: var(--text-sub);
    }

    /* --- セクション2：動画・設定・プレイリストエリア --- */
    .video-section {
      padding: 60px 20px 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background-color: var(--card-bg);
      border-top: 1px solid #1f1f1f;
    }

    .video-container {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      background-color: #000;
      border: 1px solid #1f1f1f;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .settings-grid {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .setting-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .box-label {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .timer-preset-group {
      display: flex;
      gap: 8px;
    }

    .preset-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.6rem;
      font-size: 0.9rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-weight: 600;
    }

    .preset-btn.active {
      background: var(--accent-orange);
      color: #000;
      border-color: var(--accent-orange);
    }

    .color-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .color-chip {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-chip.active {
      border-color: var(--accent-orange);
      background: rgba(255, 255, 255, 0.15);
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* プレイリストボックス */
    .playlist-section {
      width: 100%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .playlist-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--accent-orange);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-input-group {
      display: flex;
      gap: 8px;
    }

    .playlist-input-group input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.75rem 1.2rem;
      border-radius: 30px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .playlist-input-group input:focus {
      border-color: var(--accent-orange);
    }

    .playlist-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .playlist-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(247, 151, 29, 0.4);
    }

    .playlist-item.active {
      border-color: var(--accent-orange);
      background: rgba(247, 151, 29, 0.1);
    }

    .playlist-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      flex: 1;
    }

    .playlist-item-icon {
      color: var(--accent-orange);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .playlist-item-url {
      font-size: 0.85rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-item.active .playlist-item-url {
      color: var(--text-main);
      font-weight: 600;
    }

    .playlist-del-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .playlist-del-btn:hover {
      color: #ff4d4d;
      background: rgba(255, 77, 77, 0.1);
    }

    .empty-playlist {
      text-align: center;
      color: var(--text-sub);
      font-size: 0.85rem;
      padding: 16px 0;
    }
  </style>
</head>
<body>

  <!-- 初回アクセス用 年齢確認モーダル -->
  <div class="age-modal" id="ageModal">
    <div class="age-modal-content">
      <div class="age-modal-title">年齢確認</div>
      <div class="age-modal-desc">あなたは 18 歳以上ですか？</div>
      <div class="age-btn-group">
        <button class="age-btn yes" onclick="verifyAge(true)">はい (Y)</button>
        <button class="age-btn no" onclick="verifyAge(false)">いいえ (N)</button>
      </div>
    </div>
  </div>

  <!-- コマンドモード モーダル (67入力で起動) -->
  <div class="cmd-modal" id="cmdModal">
    <div class="cmd-content">
      <div class="cmd-header">
        <span>⚡ COMMAND MODE (67)</span>
        <span style="font-size: 0.8rem; color: var(--text-sub);">[Esc] で閉じる</span>
      </div>
      <div class="cmd-list">
        <div class="cmd-item"><span class="num">1</span> <span>① 休憩からスタート (5分休憩 / 25分)</span></div>
        <div class="cmd-item"><span class="num">2</span> <span>② 休憩からスタート (10分休憩 / 50分)</span></div>
        <div class="cmd-item"><span class="num">3</span> <span>③ 通常セット (50分集中 / 10分休憩)</span></div>
        <div class="cmd-item"><span class="num">4</span> <span>④ ショートセット (25分集中 / 5分休憩)</span></div>
        <div class="cmd-item"><span class="num">5</span> <span>⑤ タイマー +10分追加</span></div>
        <div class="cmd-item"><span class="num">6</span> <span>⑥ タイマー +25分追加</span></div>
      </div>
      <div class="cmd-footer">キーボードの [1]〜[6] を押してコマンドを選択してください</div>
    </div>
  </div>

  <!-- 共通ヘッダー自動読み込みプレースホルダー -->
  <div id="header-placeholder"></div>

  <!-- タイマーエリア -->
  <section class="timer-section">
    <div class="container">
      <div class="status" id="status">STUDY TIME</div>
      <div class="timer" id="timer">50:00</div>
      <div class="controls">
        <div class="btn-row">
          <button id="startBtn">開始</button>
          <button id="resetBtn">リセット</button>
        </div>
        <button class="fs-btn" id="fsBtn">⛶ フルスクリーンにする</button>
      </div>
    </div>
  </section>

  <!-- 動画 ＆ 各種設定・プレイリストエリア -->
  <section class="video-section">
    <div class="video-container">
      <iframe 
        id="bgmIframe"
        src="" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>
    </div>

    <div class="settings-grid">
      <!-- タイマー時間設定 -->
      <div class="setting-box">
        <div class="box-label">⏱️ タイマー時間設定</div>
        <div class="timer-preset-group">
          <button class="preset-btn" id="preset25" onclick="setTimerPreset(25, 5)">25分 / 5分</button>
          <button class="preset-btn active" id="preset50" onclick="setTimerPreset(50, 10)">50分 / 10分</button>
        </div>
      </div>

      <!-- カラーテーマ設定 -->
      <div class="setting-box">
        <div class="box-label">🎨 カラーテーマ（勉強時 / 休憩時）</div>
        <div class="color-presets">
          <button class="color-chip active" onclick="setColorTheme('#0F2350', '#3a1015', this)">
            <span class="color-dot" style="background:#0F2350;"></span>ネイビー/ワイン
          </button>
          <button class="color-chip" onclick="setColorTheme('#4a1525', '#1a0008', this)">
            <span class="color-dot" style="background:#ff6b00;"></span>ピンクダーク
          </button>
          <button class="color-chip" onclick="setColorTheme('#0a0a0a', '#1a1a1a', this)">
            <span class="color-dot" style="background:#ffffff;"></span>フルブラック
          </button>
          <button class="color-chip" onclick="setColorTheme('#0b2b18', '#1c0b2b', this)">
            <span class="color-dot" style="background:#2ecc71;"></span>サイバーグリーン
          </button>
        </div>
      </div>
    </div>

    <!-- 疑似プレイリスト管理ボックス -->
    <div class="playlist-section">
      <div class="playlist-title">🎵 マイプレイリスト (LocalStorage保存)</div>
      <div class="playlist-input-group">
        <input type="text" id="playlistUrlInput" placeholder="YouTube URLまたはIDを入力して追加">
        <button onclick="addPlaylistTrack()">追加</button>
      </div>
      <div class="playlist-items" id="playlistContainer">
        <!-- JavaScriptで動的生成 -->
      </div>
    </div>
  </section>

  <script>
    // --- 共通ヘッダーの自動読み込み ---
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      });

    // --- 初回アクセス時 年齢確認機能 ---
    function checkAgeVerification() {
      const isVerified = localStorage.getItem('age_verified');
      if (isVerified !== 'true') {
        document.getElementById('ageModal').classList.add('active');
      }
    }

    function verifyAge(isOver18) {
      if (isOver18) {
        localStorage.setItem('age_verified', 'true');
        document.getElementById('ageModal').classList.remove('active');
      } else {
        localStorage.setItem('age_verified', 'false');
        alert("18歳未満の方はご利用いただけません。");
        window.location.href = "https://www.google.com";
      }
    }

    // --- QRコード モーダル制御 ---
    function openQrModal() {
      const modal = document.getElementById('qrModal');
      if (modal) modal.classList.add('active');
    }

    function closeQrModal() {
      const modal = document.getElementById('qrModal');
      if (modal) modal.classList.remove('active');
    }

    function closeQrModalOnBg(event) {
      if (event.target.id === 'qrModal') {
        closeQrModal();
      }
    }

    // --- カラーテーマ切り替え関数 ---
    function setColorTheme(workBg, breakBg, btnElement) {
      document.documentElement.style.setProperty('--bg-work', workBg);
      document.documentElement.style.setProperty('--bg-break', breakBg);
      document.body.style.backgroundColor = workBg;

      document.querySelectorAll('.color-chip').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    // --- プレイリスト管理ロジック (localStorage + 初期プリセット) ---
    const defaultPlaylist = [
      { id: 'ZB0amc1TZ3Y', url: 'https://www.youtube.com/watch?v=ZB0amc1TZ3Y' },
      { id: 'YO-6FsfdXbo', url: 'https://www.youtube.com/watch?v=YO-6FsfdXbo' },
      { id: 'yLJHxfJpoIM', url: 'https://www.youtube.com/watch?v=yLJHxfJpoIM' },
      { id: 'BylPLfvm-nM', url: 'https://www.youtube.com/watch?v=BylPLfvm-nM' },
      { id: 'YY2BjQ7wv-o', url: 'https://www.youtube.com/watch?v=YY2BjQ7wv-o' },
      { id: 'gIYb014up6g', url: 'https://www.youtube.com/watch?v=gIYb014up6g' }
    ];

    let playlist = JSON.parse(localStorage.getItem('jiro_playlist'));
    if (!playlist || playlist.length === 0) {
      playlist = defaultPlaylist;
      localStorage.setItem('jiro_playlist', JSON.stringify(playlist));
    }

    let currentVideoId = playlist.length > 0 ? playlist[0].id : 'ZB0amc1TZ3Y';

    const bgmIframe = document.getElementById('bgmIframe');
    const playlistContainer = document.getElementById('playlistContainer');
    const playlistUrlInput = document.getElementById('playlistUrlInput');

    function savePlaylist() {
      localStorage.setItem('jiro_playlist', JSON.stringify(playlist));
    }

    function parseVideoId(input) {
      if (!input) return null;
      let url = input.trim();

      try {
        if (url.includes('google.com/') && (url.includes('q=') || url.includes('url='))) {
          const tempUrl = url.startsWith('http') ? url : 'https://' + url;
          const parsedObj = new URL(tempUrl);
          const targetUrl = parsedObj.searchParams.get('q') || parsedObj.searchParams.get('url');
          if (targetUrl) {
            url = decodeURIComponent(targetUrl);
          }
        }
      } catch (e) {}

      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        return match[2];
      }

      if (url.length === 11 && /^[a-zA-Z0-9_-]+$/.test(url)) {
        return url;
      }

      return null;
    }

    function addPlaylistTrack() {
      const val = playlistUrlInput.value.trim();
      const vidId = parseVideoId(val);

      if (!vidId) {
        alert('有効なYouTubeのURLまたはIDを入力してください。');
        return;
      }

      playlist.push({ id: vidId, url: val });
      savePlaylist();
      renderPlaylist();
      playlistUrlInput.value = '';
    }

    function deletePlaylistTrack(index, event) {
      event.stopPropagation();
      playlist.splice(index, 1);
      savePlaylist();
      renderPlaylist();
    }

    function playTrack(vidId) {
      currentVideoId = vidId;
      bgmIframe.src = `https://www.youtube.com/embed/${vidId}?enablejsapi=1`;
      renderPlaylist();
    }

    function renderPlaylist() {
      if (playlist.length === 0) {
        playlistContainer.innerHTML = '<div class="empty-playlist">プレイリストに曲がありません。上の入力欄から追加しよう！</div>';
        return;
      }

      playlistContainer.innerHTML = '';
      playlist.forEach((track, index) => {
        const item = document.createElement('div');
        item.className = `playlist-item ${track.id === currentVideoId ? 'active' : ''}`;
        item.onclick = () => playTrack(track.id);

        item.innerHTML = `
          <div class="playlist-item-info">
            <span class="playlist-item-icon">▶</span>
            <span class="playlist-item-url">${escapeHtml(track.url)}</span>
          </div>
          <button class="playlist-del-btn" onclick="deletePlaylistTrack(${index}, event)">×</button>
        `;
        playlistContainer.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&'`<>"]/g, match => ({
        '&': '&amp;',
        '"': '&quot;',
        "'": '&#39;',
        '<': '&lt;',
        '>': '&gt;',
      }[match] || match));
    }

    playlistUrlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addPlaylistTrack();
      }
    });

    // --- タイマー＆その他ロジック ---
    let workMinutes = 50;
    let breakMinutes = 10;
    let WORK_TIME = workMinutes * 60;
    let BREAK_TIME = breakMinutes * 60;
    let timeLeft = WORK_TIME;
    let timerId = null;
    let isWorkMode = true;

    const timerDisplay = document.getElementById('timer');
    const statusDisplay = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const fsBtn = document.getElementById('fsBtn');

    // 67コマンドモード
    let keyBuffer = '';
    const cmdModal = document.getElementById('cmdModal');

    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;

      if (e.key === 'Escape') {
        cmdModal.classList.remove('active');
        keyBuffer = '';
        return;
      }

      if (cmdModal.classList.contains('active')) {
        if (e.key >= '1' && e.key <= '6') {
          executeCommand(parseInt(e.key));
          cmdModal.classList.remove('active');
          e.preventDefault();
        }
        return;
      }

      if (e.key >= '0' && e.key <= '9') {
        keyBuffer += e.key;
        if (keyBuffer.length > 2) keyBuffer = keyBuffer.slice(-2);
        if (keyBuffer === '67') {
          cmdModal.classList.add('active');
          keyBuffer = '';
        }
      } else {
        keyBuffer = '';
      }
    });

    function executeCommand(num) {
      switch(num) {
        case 1: setTimerPreset(25, 5); startBreakModeDirectly(5 * 60); break;
        case 2: setTimerPreset(50, 10); startBreakModeDirectly(10 * 60); break;
        case 3: setTimerPreset(50, 10); break;
        case 4: setTimerPreset(25, 5); break;
        case 5: timeLeft += 10 * 60; updateDisplay(); break;
        case 6: timeLeft += 25 * 60; updateDisplay(); break;
      }
    }

    function startBreakModeDirectly(breakSec) {
      pauseTimer();
      isWorkMode = false;
      timeLeft = breakSec;
      statusDisplay.textContent = 'BREAK TIME';
      document.body.classList.add('break-mode');
      updateDisplay();
    }

    window.addEventListener('beforeunload', (e) => {
      if (timerId !== null) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${minutes}:${seconds}`;
      document.title = `${minutes}:${seconds} - ${isWorkMode ? '勉強中' : '休憩中'}`;
    }

    function setTimerPreset(work, brk) {
      pauseTimer();
      workMinutes = work;
      breakMinutes = brk;
      WORK_TIME = workMinutes * 60;
      BREAK_TIME = breakMinutes * 60;

      document.getElementById('preset25').classList.toggle('active', work === 25);
      document.getElementById('preset50').classList.toggle('active', work === 50);

      resetTimer();
    }

    function startTimer() {
      if (timerId !== null) return;
      startBtn.textContent = '一時停止';
      
      timerId = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          
          isWorkMode = !isWorkMode;
          if (isWorkMode) {
            timeLeft = WORK_TIME;
            statusDisplay.textContent = 'STUDY TIME';
            document.body.classList.remove('break-mode');
          } else {
            timeLeft = BREAK_TIME;
            statusDisplay.textContent = 'BREAK TIME';
            document.body.classList.add('break-mode');
          }
          
          updateDisplay();
          startTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = '開始';
    }

    function resetTimer() {
      pauseTimer();
      isWorkMode = true;
      timeLeft = WORK_TIME;
      statusDisplay.textContent = 'STUDY TIME';
      document.body.classList.remove('break-mode');
      updateDisplay();
    }

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        window.scrollTo({ top: 0, behavior: 'instant' });
        document.documentElement.requestFullscreen().catch(err => {
          alert(`フルスクリーンに失敗しました: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        window.scrollTo({ top: 0, behavior: 'instant' });
        fsBtn.textContent = '⛶ フルスクリーンを解除';
      } else {
        fsBtn.textContent = '⛶ フルスクリーンにする';
      }
    });

    startBtn.addEventListener('click', () => {
      if (timerId === null) startTimer();
      else pauseTimer();
    });

    resetBtn.addEventListener('click', resetTimer);

    // 初期化実行
    checkAgeVerification();
    updateDisplay();
    renderPlaylist();
    if (playlist.length > 0) {
      bgmIframe.src = `https://www.youtube.com/embed/${playlist[0].id}?enablejsapi=1`;
    }
  </script>
</body>
</html>
