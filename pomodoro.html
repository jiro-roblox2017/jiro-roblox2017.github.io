<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ホーム</title>
  
  <!-- タブアイコン（ファビコン）設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">

  <style>
    :root {
      --bg-main: #0a0a0a;         /* 極限まで黒に近いダーク背景 */
      --card-bg: #141414;         /* カード背景 */
      --card-hover: #1f1f1f;      /* カードホバー時 */
      --text-main: #ffffff;       /* 完全な白文字 */
      --text-sub: #a0a0a0;        /* 補足用グレー文字 */
      --accent-orange: #ff6b00;   /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    /* 固定ヘッダーグループ */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    /* 最上部サブバー（このサイトについて・免責事項） */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    /* メインヘッダー */
    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    /* HUB部分：オレンジ枠 ＋ 黒文字 */
    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* メインコンテンツ */
    main {
      padding: 28px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px 20px;
    }

    .video-card {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid transparent;
      padding: 10px;
    }

    .video-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-3px);
      border-color: rgba(255, 107, 0, 0.3);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }

    .thumbnail-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .video-card:hover .thumbnail-img {
      transform: scale(1.03);
    }

    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: var(--accent-orange);
      color: #ffffff;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .video-info {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding: 0 2px;
    }

    .channel-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #1a1a1a;
      border: 1px solid var(--accent-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .details {
      display: flex;
      flex-direction: column;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-card:hover .video-title {
      color: var(--accent-orange-hover);
    }

    .channel-name, .video-stats {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .video-stats {
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- 全ページ共通ヘッダーグループ -->
  <div class="header-group">
    <!-- 上部サブバー -->
    <div class="top-bar">
      <a href="about.html">このサイトについて</a>
      <a href="disclaimer.html">免責事項</a>
    </div>

    <!-- メインヘッダー -->
    <header>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">JIRO<span>HUB</span></span>
      </a>
    </header>
  </div>

  <main>
    <div class="video-grid">
  <!-- タイマーエリア（画面を開いた時点ではこれだけが見える） -->
  <section class="timer-section">
    <div class="container">
      <div class="status" id="status">STUDY TIME</div>
      <div class="timer" id="timer">25:00</div>
      <div class="controls">
        <button id="startBtn">開始</button>
        <button id="resetBtn">リセット</button>
      </div>
    </div>
  </section>

  <!-- 動画＆音楽変更エリア（下にスクロールすると現れる） -->
  <section class="video-section">
    <div class="video-container">
      <iframe 
        id="bgmIframe"
        src="https://www.youtube.com/embed/vCTRNKPJr40?enablejsapi=1" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- ビデオフレーム直下の操作エリア -->
    <div class="bgm-controls">
      <div class="bgm-input-group">
        <input type="text" id="ytUrlInput" placeholder="YouTubeや各種URL・Googleリンクを入力">
        <button id="changeBgmBtn">動画を変更</button>
      </div>
      <a id="ytExternalLink" href="https://www.youtube.com/watch?v=vCTRNKPJr40" target="_blank" class="link-btn">
        動画で開く ↗
      </a>
    </div>
  </section>

  <script>
    const WORK_TIME = 25 * 60; // 25分（秒単位）
    const BREAK_TIME = 5 * 60;  // 5分（秒単位）

    let timeLeft = WORK_TIME;
    let timerId = null;
    let isWorkMode = true;

    const timerDisplay = document.getElementById('timer');
    const statusDisplay = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const bgmIframe = document.getElementById('bgmIframe');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const changeBgmBtn = document.getElementById('changeBgmBtn');
    const ytExternalLink = document.getElementById('ytExternalLink');

    // 時間の表示を更新 (MM:SS)
    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${minutes}:${seconds}`;
      document.title = `${minutes}:${seconds} - ${isWorkMode ? '勉強中' : '休憩中'}`;
    }

    // タイマーのカウントダウン処理
    function startTimer() {
      if (timerId !== null) return; // 既に実行中の場合は何もしない

      startBtn.textContent = '一時停止';
      
      timerId = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          
          // 勉強と休憩を自動切り替え
          isWorkMode = !isWorkMode;
          if (isWorkMode) {
            timeLeft = WORK_TIME;
            statusDisplay.textContent = 'STUDY TIME';
            document.body.classList.remove('break-mode');
          } else {
            timeLeft = BREAK_TIME;
            statusDisplay.textContent = 'BREAK TIME';
            document.body.classList.add('break-mode');
          }
          
          updateDisplay();
          startTimer(); // 次のセッションを自動スタート
        }
      }, 1000);
    }

    // タイマーの停止
    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = '開始';
    }

    // タイマーのリセット
    function resetTimer() {
      pauseTimer();
      isWorkMode = true;
      timeLeft = WORK_TIME;
      statusDisplay.textContent = 'STUDY TIME';
      document.body.classList.remove('break-mode');
      updateDisplay();
    }

    // 入力されたURLからGoogleのリダイレクトを解除し、最適なURL/動画IDを判別する関数
    function parseVideoUrl(input) {
      if (!input) return null;
      let url = input.trim();

      // 1. GoogleのリダイレクトURL (google.com/url?q=... や ?url=...) から中の実際のURLを抽出する処理
      try {
        if (url.includes('google.com/') && (url.includes('q=') || url.includes('url='))) {
          const tempUrl = url.startsWith('http') ? url : 'https://' + url;
          const parsedObj = new URL(tempUrl);
          const targetUrl = parsedObj.searchParams.get('q') || parsedObj.searchParams.get('url');
          if (targetUrl) {
            url = decodeURIComponent(targetUrl);
          }
        }
      } catch (e) {
        // パースエラー時はそのまま進める
      }

      // 2. YouTubeの動画IDやURLの判定
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        return { type: 'youtube', id: match[2], original: url };
      }

      // 3. 動画ID単体（11桁）の場合
      if (url.length === 11 && /^[a-zA-Z0-9_-]+$/.test(url)) {
        return { type: 'youtube', id: url, original: `https://www.youtube.com/watch?v=${url}` };
      }

      // 4. その他のURL（Canvaの共有リンクや、その他の埋め込み用URLなど）
      return { type: 'other', url: url };
    }

    // 動画変更処理
    function changeBgm() {
      const inputVal = ytUrlInput.value.trim();
      if (!inputVal) return;

      const result = parseVideoUrl(inputVal);

      if (result.type === 'youtube') {
        // YouTubeの場合
        bgmIframe.src = `https://www.youtube.com/embed/${result.id}?enablejsapi=1`;
        ytExternalLink.href = `https://www.youtube.com/watch?v=${result.id}`;
        ytUrlInput.value = '';
      } else if (result.type === 'other') {
        // その他のURL（Canvaなどiframeで表示可能なリンク）の場合
        bgmIframe.src = result.url;
        ytExternalLink.href = result.url;
        ytUrlInput.value = '';
      } else {
        alert('正しいURLを入力してください。');
      }
    }

    // イベントリスナー
    startBtn.addEventListener('click', () => {
      if (timerId === null) {
        startTimer();
      } else {
        pauseTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);
    changeBgmBtn.addEventListener('click', changeBgm);
    ytUrlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') changeBgm();
    });

    // 初期表示設定
    updateDisplay();
  </script>
</body>
</html>
