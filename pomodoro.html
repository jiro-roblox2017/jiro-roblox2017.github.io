<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ポモドーロタイマー</title>
  
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-work: #0F2350;          
      --bg-break: #3a1015;         
      --card-bg: #141414;
      --text-main: #ffffff;        
      --text-sub: #a0a0a0;         
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(255, 255, 255, 0.08);
      --accent-orange: #F7971D;    
      --accent-orange-hover: #ff9f2e;
    }

    html:fullscreen,
    html:-webkit-full-screen,
    body:fullscreen,
    body:-webkit-full-screen {
      overflow: hidden !important;
      height: 100vh !important;
    }

    /* フルスクリーン時はヘッダーと下部の動画・設定画面を非表示にしてタイマーに完全没入 */
    :fullscreen .header-group,
    :fullscreen .video-section,
    :-webkit-full-screen .header-group,
    :-webkit-full-screen .video-section {
      display: none !important;
    }

    :fullscreen .timer-section,
    :-webkit-full-screen .timer-section {
      min-height: 100vh !important;
      padding: 20px !important;
    }

    :fullscreen .timer,
    :-webkit-full-screen .timer {
      font-size: 8rem !important;
      margin-bottom: 2.5rem !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-work);
      transition: background-color 0.8s ease;
    }

    body.break-mode {
      background-color: var(--bg-break);
    }

    /* --- 初回アクセス時・下部スクロール誘導サイン --- */
    .scroll-hint-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(20, 20, 20, 0.95);
      border: 1px solid var(--accent-orange);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      z-index: 1500;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(8px);
      animation: bounceHint 2s infinite ease-in-out;
    }

    .scroll-hint-banner.active {
      display: flex;
    }

    .scroll-hint-banner button {
      background: var(--accent-orange);
      color: #000;
      border: none;
      padding: 4px 12px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    @keyframes bounceHint {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    /* --- 年齢確認モーダル --- */
    .age-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .age-modal.active {
      display: flex;
    }

    .age-modal-content {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }

    .age-modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .age-modal-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .age-btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .age-btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .age-btn.yes {
      background-color: var(--accent-orange);
      color: #000000;
    }

    .age-btn.no {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .age-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* --- カスタム時間設定モーダル --- */
    .custom-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2200;
      justify-content: center;
      align-items: center;
    }

    .custom-modal.active {
      display: flex;
    }

    .custom-modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-orange);
      padding: 32px 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .custom-modal-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-orange);
      text-align: center;
    }

    .custom-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .custom-input-group label {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .custom-input-group input {
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .custom-input-group input:focus {
      border-color: var(--accent-orange);
    }

    .custom-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .custom-btn {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-size: 0.9rem;
    }

    .custom-btn.save {
      background-color: var(--accent-orange);
      color: #000;
    }

    .custom-btn.cancel {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
    }

    /* --- コマンドモード モーダル (67) --- */
    .cmd-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 2500;
      justify-content: center;
      align-items: center;
    }

    .cmd-modal.active {
      display: flex;
    }

    .cmd-content {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-orange);
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }

    .cmd-header {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-orange);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cmd-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-right: 4px;
    }

    .cmd-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cmd-item span.num {
      background: var(--accent-orange);
      color: #000;
      font-weight: bold;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.8rem;
    }

    .cmd-footer {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
    }

    /* --- 固定ヘッダーグループ --- */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a, .qr-trigger-btn {
      color: var(--text-sub);
      text-decoration: none;
      background: none;
      border: none;

      font-size: 0.75rem;
