<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ポモドーロタイマー</title>
  
  <!-- タブアイコン（ファビコン）設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-work: #191970;          /* 勉強時：#191970 (ミッドナイトブルー) */
      --bg-break: #3d0c11;         /* 休憩時：#3d0c11 (ダークバーガンディ) */
      --card-bg: #141414;
      --text-main: #ffffff;        /* 完全な白文字 */
      --text-sub: #a0a0a0;         /* 補足用グレー文字 */
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(255, 255, 255, 0.08);
      --accent-orange: #ff6b00;    /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-work);
      transition: background-color 0.8s ease;
    }

    /* 休憩モード時の背景 */
    body.break-mode {
      background-color: var(--bg-break);
    }

    /* 固定ヘッダーグループ */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* セクション1：タイマーエリア */
    .timer-section {
      min-height: calc(100vh - 54px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      text-align: center;
    }

    .status {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      margin-bottom: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .timer {
      font-size: 7rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2rem;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* タイマー時間プリセット切替ボタンエリア */
    .timer-preset-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

      background: rgba(255, 25
