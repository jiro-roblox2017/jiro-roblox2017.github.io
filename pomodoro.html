<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ポモドーロタイマー</title>
  
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-work: #191970;          
      --bg-break: #3d0c11;         
      --card-bg: #141414;
      --text-main: #ffffff;        
      --text-sub: #a0a0a0;         
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(255, 255, 255, 0.08);
      --accent-orange: #F7971D;    
      --accent-orange-hover: #ff9f2e;
    }

    html:fullscreen,
    html:-webkit-full-screen,
    body:fullscreen,
    body:-webkit-full-screen {
      overflow: hidden !important;
      height: 100vh !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-work);
      transition: background-color 0.8s ease;
    }

    body.break-mode {
      background-color: var(--bg-break);
    }

    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
      height: 80px;
    }

    /* 最上部サブバー */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a, .qr-trigger-btn {
      color: var(--text-sub);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: inherit;
      padding: 0;
      transition: color 0.2s ease;
    }

    .top-bar a:hover, .qr-trigger-btn:hover {
      color: var(--accent-orange);
    }

    /* QRコード ポップアップモーダル */
    .qr-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }

    .qr-modal.active {
      display: flex;
    }

    .qr-modal-content {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .qr-modal-content img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .qr-close-btn {
      background: var(--accent-orange);
      color: #000;
      border: none;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .qr-close-btn:hover {
      opacity: 0.85;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    .timer-section {
      height: calc(100vh - 80px);
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      text-align: center;
    }

    .status {
      font-size: 1.5rem;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .timer {
      font-size: 8rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2.5rem;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      margin-bottom: 16px;
    }

    .fs-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .fs-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-orange);
    }

    button, .link-btn {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.8rem 2.5rem;
      font-size: 1.05rem;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    button:hover, .link-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-orange);
      transform: translateY(-2px);
    }

    .video-section {
      min-height: 1080px;
      padding: 60px 20px 100px 20px;
      background-color: var(--card-bg);
      border-top: 1px solid #1f1f1f;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .section-title {
      font-size: 1.1rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
      margin-bottom: 24px;
    }

    .split-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      width: 100%;
      max-width: 1100px;
      justify-content: center;
    }

    .left-panel {
      flex: 1 1 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .right-panel {
      flex: 1 1 400px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid #262626;
      padding: 24px;
      border-radius: 16px;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      background-color: #000;
      border: 1px solid #1f1f1f;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .setting-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .box-label {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .timer-preset-group {
      display: flex;
      gap: 8px;
    }

    .preset-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.6rem;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .preset-btn.active {
      background: var(--accent-orange);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-orange);
    }

    .color-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .color-chip {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-chip.active {
      border-color: var(--accent-orange);
      background: rgba(255, 255, 255, 0.15);
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .bgm-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .bgm-chip {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      font-size: 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .bgm-chip:hover, .bgm-chip.active {
      background: var(--accent-orange);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-orange);
    }

    .bgm-input-group {
      display: flex;
      gap: 8px;
    }

    .bgm-input-group input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      outline: none;
    }

    .bgm-input-group input:focus {
      border-color: var(--accent-orange);
    }

    .bgm-input-group button {
      padding: 0.6rem 1.2rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="header-group">
    <!-- 最上部サブバー（ここにQRボタンを追加） -->
    <div class="top-bar">
      <button class="qr-trigger-btn" onclick="openQrModal()">📱 QRコード</button>
      <a href="about.html">このサイトについて</a>
      <a href="disclaimer.html">免責事項</a>
    </div>

    <header>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">JIRO<span>HUB</span></span>
      </a>
    </header>
  </div>

  <!-- QRコード表示用ポップアップモーダル -->
  <div class="qr-modal" id="qrModal" onclick="closeQrModalOnBg(event)">
    <div class="qr-modal-content">
      <img src="QR.png" alt="シェア用QRコード"[cite: 1]>
      <button class="qr-close-btn" onclick="closeQrModal()">閉じる</button>
    </div>
  </div>

  <section class="timer-section">
    <div class="container">
      <div class="status" id="status">STUDY TIME</div>
      <div class="timer" id="timer">25:00</div>
      <div class="controls">
        <button id="startBtn">開始</button>
        <button id="resetBtn">リセット</button>
      </div>
      <button class="fs-btn" id="fsBtn">⛶ フルスクリーンにする</button>
    </div>
  </section>

  <section class="video-section">
    <div class="section-title">▼ プレイヤー ＆ タイマー設定</div>

    <div class="split-container">
      <div class="left-panel">
        <div class="video-container">
          <iframe 
            id="bgmIframe"
            src="https://www.youtube.com/embed/33L48f1sSrg?enablejsapi=1" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
          </iframe>
        </div>
        <a id="ytExternalLink" href="https://www.youtube.com/watch?v=33L48f1sSrg" target="_blank" class="link-btn" style="width: 100%;">
          YouTubeで直接開く ↗
        </a>
      </div>

      <div class="right-panel">
        <div class="setting-box">
          <div class="box-label">⏱️ タイマー時間設定</div>
          <div class="timer-preset-group">
            <button class="preset-btn active" id="preset25" onclick="setTimerPreset(25, 5)">25分 / 5分</button>
            <button class="preset-btn" id="preset50" onclick="setTimerPreset(50, 10)">50分 / 10分</button>
          </div>
        </div>

        <div class="setting-box">
          <div class="box-label">🎨 カラーテーマ（勉強 / 休憩）</div>
          <div class="color-presets">
            <button class="color-chip active" onclick="setColorTheme('#191970', '#3d0c11', this)">
              <span class="color-dot" style="background:#191970;"></span>ネイビー/ワイン
            </button>
            <button class="color-chip" onclick="setColorTheme('#4a1525', '#1a0008', this)">
              <span class="color-dot" style="background:#ff69b4;"></span>ピンクダーク
            </button>
            <button class="color-chip" onclick="setColorTheme('#0a0a0a', '#1a1a1a', this)">
              <span class="color-dot" style="background:#ffffff;"></span>フルブラック
            </button>
            <button class="color-chip" onclick="setColorTheme('#0b2b18', '#1c0b2b', this)">
              <span class="color-dot" style="background:#2ecc71;"></span>サイバーグリーン
            </button>
          </div>
        </div>

        <div class="setting-box">
          <div class="box-label">🎵 BGM プレイリスト</div>
          <div class="bgm-presets">
            <button class="bgm-chip active" onclick="loadBgm('33L48f1sSrg', this)">🔥 Phonk (学校対応)</button>
            <button class="bgm-chip" onclick="loadBgm('Ljq0c5C7LuM', this)">🔥 Phonk (元動画)</button>
            <button class="bgm-chip" onclick="loadBgm('h8UpC5JbMU0', this)">🌲 マイクラ</button>
            <button class="bgm-chip" onclick="loadBgm('Zwo-15CkW24', this)">✨ フリーBGM2</button>
            <button class="bgm-chip" onclick="loadBgm('mNLJMTRvyj8', this)">☕ ジャズ</button>
          </div>
        </div>

        <div class="setting-box">
          <div class="box-label">🔗 動画URLを入力</div>
          <div class="bgm-input-group">
            <input type="text" id="ytUrlInput" placeholder="YouTube URLまたはIDを入力">
            <button id="changeBgmBtn">変更</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    let workMinutes = 25;
    let breakMinutes = 5;

    let WORK_TIME = workMinutes * 60;
    let BREAK_TIME = breakMinutes * 60;

    let timeLeft = WORK_TIME;
    let timerId = null;
    let isWorkMode = true;

    const timerDisplay = document.getElementById('timer');
    const statusDisplay = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const fsBtn = document.getElementById('fsBtn');
    const bgmIframe = document.getElementById('bgmIframe');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const changeBgmBtn = document.getElementById('changeBgmBtn');
    const ytExternalLink = document.getElementById('ytExternalLink');

    // QRコードモーダル制御関数
    function openQrModal() {
      document.getElementById('qrModal').classList.add('active');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.remove('active');
    }

    function closeQrModalOnBg(event) {
      if (event.target.id === 'qrModal') {
        closeQrModal();
      }
    }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${minutes}:${seconds}`;
      document.title = `${minutes}:${seconds} - ${isWorkMode ? '勉強中' : '休憩中'}`;
    }

    function setTimerPreset(work, brk) {
      pauseTimer();
      workMinutes = work;
      breakMinutes = brk;
      WORK_TIME = workMinutes * 60;
      BREAK_TIME = breakMinutes * 60;

      document.getElementById('preset25').classList.toggle('active', work === 25);
      document.getElementById('preset50').classList.toggle('active', work === 50);

      resetTimer();
    }

    function setColorTheme(workBg, breakBg, btnElement) {
      document.documentElement.style.setProperty('--bg-work', workBg);
      document.documentElement.style.setProperty('--bg-break', breakBg);

      document.querySelectorAll('.color-chip').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    function startTimer() {
      if (timerId !== null) return;
      startBtn.textContent = '一時停止';
      
      timerId = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          
          isWorkMode = !isWorkMode;
          if (isWorkMode) {
            timeLeft = WORK_TIME;
            statusDisplay.textContent = 'STUDY TIME';
            document.body.classList.remove('break-mode');
          } else {
            timeLeft = BREAK_TIME;
            statusDisplay.textContent = 'BREAK TIME';
            document.body.classList.add('break-mode');
          }
          
          updateDisplay();
          startTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = '開始';
    }

    function resetTimer() {
      pauseTimer();
      isWorkMode = true;
      timeLeft = WORK_TIME;
      statusDisplay.textContent = 'STUDY TIME';
      document.body.classList.remove('break-mode');
      updateDisplay();
    }

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        window.scrollTo({ top: 0, behavior: 'instant' });
        document.documentElement.requestFullscreen().catch(err => {
          alert(`フルスクリーンに失敗しました: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        window.scrollTo({ top: 0, behavior: 'instant' });
        fsBtn.textContent = '⛶ フルスクリーンを解除';
      } else {
        fsBtn.textContent = '⛶ フルスクリーンにする';
      }
    });

    function parseVideoUrl(input) {
      if (!input) return null;
      let url = input.trim();

      try {
        if (url.includes('google.com/')) {
          const tempUrl = url.startsWith('http') ? url : 'https://' + url;
          const parsedObj = new URL(tempUrl);
          const targetUrl = parsedObj.searchParams.get('url') || parsedObj.searchParams.get('q');
          if (targetUrl) {
            url = decodeURIComponent(targetUrl);
          }
        }
      } catch (e) {}

      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        return { type: 'youtube', id: match[2] };
      }

      if (url.length === 11 && /^[a-zA-Z0-9_-]+$/.test(url)) {
        return { type: 'youtube', id: url };
      }

      return { type: 'other', url: url };
    }

    function loadBgm(videoId, element) {
      bgmIframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
      ytExternalLink.href = `https://www.youtube.com/watch?v=${videoId}`;
      
      document.querySelectorAll('.bgm-chip').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');
    }

    function changeBgm() {
      const inputVal = ytUrlInput.value.trim();
      if (!inputVal) return;

      const result = parseVideoUrl(inputVal);

      if (result.type === 'youtube') {
        bgmIframe.src = `https://www.youtube.com/embed/${result.id}?enablejsapi=1`;
        ytExternalLink.href = `https://www.youtube.com/watch?v=${result.id}`;
        ytUrlInput.value = '';
        document.querySelectorAll('.bgm-chip').forEach(btn => btn.classList.remove('active'));
      } else if (result.type === 'other') {
        bgmIframe.src = result.url;
        ytExternalLink.href = result.url;
        ytUrlInput.value = '';
      } else {
        alert('正しいURLを入力してください。');
      }
    }

    startBtn.addEventListener('click', () => {
      if (timerId === null) {
        startTimer();
      } else {
        pauseTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);
    changeBgmBtn.addEventListener('click', changeBgm);
    ytUrlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') changeBgm();
    });

    updateDisplay();
  </script>
</body>
</html>
