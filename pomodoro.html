<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ポモドーロタイマー</title>
  
  <!-- タブアイコン（ファビコン）設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-work: #0a0a0a;          /* 勉強時：index共通の極黒ダーク背景 */
      --bg-break: #3a1015;         /* 休憩時：落ち着いたダークワインレッド */
      --card-bg: #141414;
      --text-main: #ffffff;        /* 完全な白文字 */
      --text-sub: #a0a0a0;         /* 補足用グレー文字 */
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(255, 255, 255, 0.08);
      --accent-orange: #ff6b00;    /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-work);
      transition: background-color 0.8s ease;
    }

    /* 休憩モード時の背景 */
    body.break-mode {
      background-color: var(--bg-break);
    }

    /* 固定ヘッダーグループ */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    /* 最上部サブバー（このサイトについて・免責事項） */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    /* メインヘッダー */
    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    /* HUB部分：オレンジ枠 ＋ 黒文字 */
    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* セクション1：タイマーエリア（ヘッダー全体の高さに合わせて調整） */
    .timer-section {
      min-height: calc(100vh - 84px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      text-align: center;
    }

    .status {
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      margin-bottom: 1rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .timer {
      font-size: 6.5rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2.5rem;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button, .link-btn {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.75rem 2.2rem;
      font-size: 1rem;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    button:hover, .link-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-orange);
      transform: translateY(-2px);
    }

    button:active, .link-btn:active {
      transform: translateY(0);
    }

    /* セクション2：下部の動画＆BGMコントロールエリア */
    .video-section {
      padding: 60px 20px 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background-color: var(--card-bg);
      border-top: 1px solid #1f1f1f;
    }

    .video-container {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      background-color: #000;
      border: 1px solid #1f1f1f;
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* プレイヤー直下の入力・操作パネル */
    .bgm-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      max-width: 720px;
      justify-content: center;
      align-items: center;
    }

    .bgm-input-group {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 280px;
    }

    .bgm-controls input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      padding: 0.75rem 1.2rem;
      border-radius: 30px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .bgm-controls input::placeholder {
      color: var(--text-sub);
    }

    .bgm-controls input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-orange);
    }

    .bgm-controls button, .bgm-controls .link-btn {
      font-size: 0.9rem;
      padding: 0.75rem 1.5rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- 全ページ共通ヘッダーグループ -->
  <div class="header-group">
    <!-- 上部サブバー -->
    <div class="top-bar">
      <a href="about.html">このサイトについて</a>
      <a href="disclaimer.html">免責事項</a>
    </div>

    <!-- メインヘッダー -->
    <header>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">JIRO<span>HUB</span></span>
      </a>
    </header>
  </div>

  <!-- タイマーエリア -->
  <section class="timer-section">
    <div class="container">
      <div class="status" id="status">STUDY TIME</div>
      <div class="timer" id="timer">25:00</div>
      <div class="controls">
        <button id="startBtn">開始</button>
        <button id="resetBtn">リセット</button>
      </div>
    </div>
  </section>

  <!-- 動画＆音楽変更エリア -->
  <section class="video-section">
    <div class="video-container">
      <iframe 
        id="bgmIframe"
        src="https://www.youtube.com/embed/vCTRNKPJr40?enablejsapi=1" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- プレイヤー直下の操作エリア -->
    <div class="bgm-controls">
      <div class="bgm-input-group">
        <input type="text" id="ytUrlInput" placeholder="YouTube、Googleリンク、URLやIDを入力">
        <button id="changeBgmBtn">動画を変更</button>
      </div>
      <a id="ytExternalLink" href="https://www.youtube.com/watch?v=vCTRNKPJr40" target="_blank" class="link-btn">
        動画で開く ↗
      </a>
    </div>
  </section>

  <script>
    const WORK_TIME = 25 * 60; // 25分
    const BREAK_TIME = 5 * 60;  // 5分

    let timeLeft = WORK_TIME;
    let timerId = null;
    let isWorkMode = true;

    const timerDisplay = document.getElementById('timer');
    const statusDisplay = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const bgmIframe = document.getElementById('bgmIframe');
    const ytUrlInput = document.getElementById('ytUrlInput');
    const changeBgmBtn = document.getElementById('changeBgmBtn');
    const ytExternalLink = document.getElementById('ytExternalLink');

    // 時間表示更新
    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      timerDisplay.textContent = `${minutes}:${seconds}`;
      document.title = `${minutes}:${seconds} - ${isWorkMode ? '勉強中' : '休憩中'}`;
    }

    // タイマー開始
    function startTimer() {
      if (timerId !== null) return;
      startBtn.textContent = '一時停止';
      
      timerId = setInterval(() => {
        timeLeft--;
        updateDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerId);
          timerId = null;
          
          isWorkMode = !isWorkMode;
          if (isWorkMode) {
            timeLeft = WORK_TIME;
            statusDisplay.textContent = 'STUDY TIME';
            document.body.classList.remove('break-mode');
          } else {
            timeLeft = BREAK_TIME;
            statusDisplay.textContent = 'BREAK TIME';
            document.body.classList.add('break-mode');
          }
          
          updateDisplay();
          startTimer();
        }
      }, 1000);
    }

    // タイマー一時停止
    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = '開始';
    }

    // タイマーリセット
    function resetTimer() {
      pauseTimer();
      isWorkMode = true;
      timeLeft = WORK_TIME;
      statusDisplay.textContent = 'STUDY TIME';
      document.body.classList.remove('break-mode');
      updateDisplay();
    }

    // URL解析（Googleリダイレクト・YouTube・その他対応）
    function parseVideoUrl(input) {
      if (!input) return null;
      let url = input.trim();

      try {
        if (url.includes('google.com/') && (url.includes('q=') || url.includes('url='))) {
          const tempUrl = url.startsWith('http') ? url : 'https://' + url;
          const parsedObj = new URL(tempUrl);
          const targetUrl = parsedObj.searchParams.get('q') || parsedObj.searchParams.get('url');
          if (targetUrl) {
            url = decodeURIComponent(targetUrl);
          }
        }
      } catch (e) {}

      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        return { type: 'youtube', id: match[2] };
      }

      if (url.length === 11 && /^[a-zA-Z0-9_-]+$/.test(url)) {
        return { type: 'youtube', id: url };
      }

      return { type: 'other', url: url };
    }

    // 動画変更
    function changeBgm() {
      const inputVal = ytUrlInput.value.trim();
      if (!inputVal) return;

      const result = parseVideoUrl(inputVal);

      if (result.type === 'youtube') {
        bgmIframe.src = `https://www.youtube.com/embed/${result.id}?enablejsapi=1`;
        ytExternalLink.href = `https://www.youtube.com/watch?v=${result.id}`;
        ytUrlInput.value = '';
      } else if (result.type === 'other') {
        bgmIframe.src = result.url;
        ytExternalLink.href = result.url;
        ytUrlInput.value = '';
      } else {
        alert('正しいURLを入力してください。');
      }
    }

    // イベントリスナー
    startBtn.addEventListener('click', () => {
      if (timerId === null) {
        startTimer();
      } else {
        pauseTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);
    changeBgmBtn.addEventListener('click', changeBgm);
    ytUrlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') changeBgm();
    });

    updateDisplay();
  </script>
</body>
</html>
