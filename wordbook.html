<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ワンクリック単語帳</title>
  
  <!-- タブアイコン（ファビコン）設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-work: #0a0a0a;          /* 極黒ダーク背景 */
      --card-bg: #141414;
      --text-main: #ffffff;        /* 完全な白文字 */
      --text-sub: #a0a0a0;         /* 補足用グレー文字 */
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.2);
      --accent-orange: #ff6b00;    /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-work);
    }

    /* 固定ヘッダーグループ（ポモドーロ等と完全共通） */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* メインコンテンツ（画面中央にカードを配置） */
    .flashcard-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .progress-info {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }

    /* フラッシュカード本体 */
    .card {
      width: 100%;
      max-width: 500px;
      height: 300px;
      background-color: var(--card-bg);
      border: 2px solid #262626;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      position: relative;
      user-select: none;
    }

    .card:hover {
      border-color: var(--accent-orange);
      transform: translateY(-3px);
      background-color: #181818;
    }

    .card-label {
      position: absolute;
      top: 20px;
      left: 24px;
      font-size: 0.8rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .card-content {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-all;
    }

    .card-hint {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
      color: var(--accent-orange);
    }

    /* 操作ボタンエリア */
    .nav-controls {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.6rem 1.6rem;
      font-size: 0.95rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    button:hover {
      background: var(--btn-hover);
      border-color: var(--accent-orange);
    }
  </style>
</head>
<body>

  <!-- ヘッダーグループ -->
  <div class="header-group">
    <div class="top-bar">
      <a href="about.html">このサイトについて</a>
      <a href="disclaimer.html">免責事項</a>
    </div>

    <header>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">JIRO<span>HUB</span></span>
      </a>
    </header>
  </div>

  <!-- フラッシュカードエリア -->
  <section class="flashcard-section">
    <div class="progress-info" id="progressInfo">Unit 4 & 5 (1 / 61)</div>
    
    <div class="card" id="flashcard" onclick="handleCardClick()">
      <div class="card-label" id="cardLabel">日本語訳</div>
      <div class="card-content" id="cardContent">読み込み中...</div>
      <div class="card-hint">クリックして英語を表示</div>
    </div>

    <div class="nav-controls">
      <button onclick="prevCard()">前の単語</button>
      <button onclick="nextCard()">次の単語</button>
    </div>
  </section>

  <script>
    // 単語データ（Unit 4 & 5）
    const words = [
      { en: "prepared", jp: "[形] 用意ができている、備えた", unit: "Unit 4" },
      { en: "disaster", jp: "[名] 災害", unit: "Unit 4" },
      { en: "shelter", jp: "[名] 避難所", unit: "Unit 4" },
      { en: "store", jp: "[動] …を蓄える", unit: "Unit 4" },
      { en: "case", jp: "[名] 場合", unit: "Unit 4" },
      { en: "extinguisher", jp: "[名] 消火器", unit: "Unit 4" },
      { en: "in case of", jp: "…の場合には", unit: "Unit 4" },
      { en: "encourage(d)", jp: "[動] …を勇気づける、励ます", unit: "Unit 4" },
      { en: "personality", jp: "[名] 個性、性格、人格", unit: "Unit 4" },
      { en: "hit", jp: "[動] hitの過去形", unit: "Unit 4" },
      { en: "hit", jp: "[動] (災害・不幸などが)襲う", unit: "Unit 4" },
      { en: "comfort(ed)", jp: "[動] …を慰める、元気づける", unit: "Unit 4" },
      { en: "nearby", jp: "[形] 近くの", unit: "Unit 4" },
      { en: "safe", jp: "[形] 安全な", unit: "Unit 4" },
      { en: "all the time", jp: "常に", unit: "Unit 4" },
      { en: "done", jp: "[動] doの過去分詞", unit: "Unit 4" },
      { en: "prepare", jp: "[動] (…の)準備をする、備える", unit: "Unit 4" },
      { en: "emergency", jp: "[名] 緊急事態", unit: "Unit 4" },
      { en: "kit", jp: "[名] 道具[用具]一式", unit: "Unit 4" },
      { en: "recommend(ed)", jp: "[動] …をすすめる、…を推薦する", unit: "Unit 4" },
      { en: "earthquake", jp: "[名] 地震", unit: "Unit 4" },
      { en: "several", jp: "[形] いくつかの", unit: "Unit 4" },
      { en: "bridge", jp: "[名] 橋、かけ橋", unit: "Unit 4" },
      { en: "between", jp: "[前] (…と~)の間で", unit: "Unit 4" },
      { en: "energetic", jp: "[形] 精力的な、エネルギッシュな", unit: "Unit 4" },
      { en: "rode", jp: "[動] rideの過去形", unit: "Unit 4" },
      { en: "bicycle", jp: "[名] 自転車", unit: "Unit 4" },
      { en: "toward", jp: "[前] …のほうへ、向かって", unit: "Unit 4" },
      { en: "apartment", jp: "[名] アパート[マンション]の部屋", unit: "Unit 4" },
      { en: "caught", jp: "[動] catchの過去形・過去分詞", unit: "Unit 4" },
      { en: "tsunami", jp: "[名] 津波", unit: "Unit 4" },
      { en: "sudden", jp: "[形] 突然の、不意の", unit: "Unit 4" },
      { en: "news", jp: "[名] ニュース、知らせ", unit: "Unit 4" },
      { en: "shortly", jp: "[副] まもなく、すぐに", unit: "Unit 4" },
      { en: "corner", jp: "[名] コーナー", unit: "Unit 4" },
      { en: "exchange", jp: "[名] 交流、やりとり", unit: "Unit 4" },
      { en: "program(s)", jp: "[名] 計画、事業", unit: "Unit 4" },
      { en: "support", jp: "[動] …を支援する、応援する", unit: "Unit 4" },
      { en: "ordinary", jp: "[形] ふつの", unit: "Unit 4" },
      { en: "crisis", jp: "[名] 危機、難局", unit: "Unit 4" },
      { en: "be caught in", jp: "…に巻き込まれる", unit: "Unit 4" },
      { en: "bring ... together", jp: "…を団結させる", unit: "Unit 4" },
      { en: "keep on ...ing", jp: "…し続ける", unit: "Unit 4" },
      { en: "no longer", jp: "もはや…ない", unit: "Unit 4" },
      { en: "internet", jp: "[名] インターネット", unit: "Unit 5" },
      { en: "person", jp: "[名] 人、個人", unit: "Unit 5" },
      { en: "image", jp: "[名] 像、肖像、印象", unit: "Unit 5" },
      { en: "print(ed)", jp: "[動] …を印刷する", unit: "Unit 5" },
      { en: "leader", jp: "[名] 指導者、リーダー", unit: "Unit 5" },
      { en: "greatly", jp: "[副] おおいに、非常に", unit: "Unit 5" },
      { en: "born", jp: "[動] (be born) 生まれる", unit: "Unit 5" },
      { en: "national", jp: "[形] 国の", unit: "Unit 5" },
      { en: "non-violence", jp: "[名] 非暴力", unit: "Unit 5" },
      { en: "independence", jp: "[名] 独立", unit: "Unit 5" },
      { en: "violence", jp: "[名] 暴力", unit: "Unit 5" },
      { en: "fight", jp: "[動] たたかう", unit: "Unit 5" },
      { en: "protest", jp: "[動] 抗議する", unit: "Unit 5" },
      { en: "tough", jp: "[形] 困難な、難しい", unit: "Unit 5" },
      { en: "human rights", jp: "人権", unit: "Unit 5" },
      { en: "lawyer", jp: "[名] 弁護士", unit: "Unit 5" },
      { en: "British", jp: "[形] イギリスの / [名] イギリス人", unit: "Unit 5" },
      { en: "discrimination", jp: "[名] 差別", unit: "Unit 5" },
      { en: "freely", jp: "[副] 自由に", unit: "Unit 5" },
      { en: "sidewalk", jp: "[名] 歩道", unit: "Unit 5" },
      { en: "accept", jp: "[動] …を受け入れる", unit: "Unit 5" },
      { en: "law", jp: "[名] 法律、法", unit: "Unit 5" },
      { en: "unfair", jp: "[形] 不公平な", unit: "Unit 5" },
      { en: "stood", jp: "[動] standの過去形", unit: "Unit 5" },
      { en: "arrest(ed)", jp: "[動] …を逮捕する", unit: "Unit 5" },
      { en: "jail(s)", jp: "[名] 刑務所", unit: "Unit 5" },
      { en: "colony", jp: "[名] 植民地", unit: "Unit 5" },
      { en: "produce", jp: "[動] …を生産する", unit: "Unit 5" },
      { en: "tax", jp: "[名] 税、税金", unit: "Unit 5" },
      { en: "expensive", jp: "[形] 高価な", unit: "Unit 5" },
      { en: "follower(s)", jp: "[名] 信奉者、支持者", unit: "Unit 5" },
      { en: "thousand(s)", jp: "[名][形] 1,000(の)", unit: "Unit 5" }
    ];

    let currentIndex = 0;
    let isShowingEnglish = false; // false = 日本語表示中, true = 英語表示中

    const cardContent = document.getElementById('cardContent');
    const cardLabel = document.getElementById('cardLabel');
    const cardHint = document.getElementById('cardHint');
    const progressInfo = document.getElementById('progressInfo');

    function updateCard() {
      const currentWord = words[currentIndex];
      progressInfo.textContent = `${currentWord.unit} (${currentIndex + 1} / ${words.length})`;
      
      if (!isShowingEnglish) {
        cardLabel.textContent = "日本語訳";
        cardContent.textContent = currentWord.jp;
        cardHint.textContent = "クリックして英語を表示";
      } else {
        cardLabel.textContent = "英語 (英単語)";
        cardContent.textContent = currentWord.en;
        cardHint.textContent = "クリックして次の単語へ";
      }
    }

    // カードをクリックした時の挙動
    function handleCardClick() {
      if (!isShowingEnglish) {
        // 日本語から英語へ裏返す
        isShowingEnglish = true;
        updateCard();
      } else {
        // 英語の状態で押したら、次の単語の「日本語」に切り替える
        isShowingEnglish = false;
        currentIndex = (currentIndex + 1) % words.length; // 最後まで行ったら最初に戻る
        updateCard();
      }
    }

    function nextCard() {
      isShowingEnglish = false;
      currentIndex = (currentIndex + 1) % words.length;
      updateCard();
    }

    function prevCard() {
      isShowingEnglish = false;
      currentIndex = (currentIndex - 1 + words.length) % words.length;
      updateCard();
    }

    // 初期表示
    updateCard();
  </script>
</body>
</html>
