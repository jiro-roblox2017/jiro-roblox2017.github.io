<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 4 & 5 暗記単語帳</title>
  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-bg: #141414;
      --card-hover: #1f1f1f;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --accent-orange: #ff6b00;
      --accent-green: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #222;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .unit-title {
      font-size: 1.2rem;
      color: var(--accent-orange);
      margin: 24px 0 12px 0;
      padding-left: 8px;
      border-left: 4px solid var(--accent-orange);
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .word-card {
      background-color: var(--card-bg);
      border: 1px solid #222;
      border-radius: 8px;
      padding: 16px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90px;
    }

    .word-card:hover {
      background-color: var(--card-hover);
      border-color: rgba(255, 107, 0, 0.4);
      transform: translateY(-2px);
    }

    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .word-num {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .english {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .japanese {
      font-size: 0.95rem;
      color: var(--accent-green);
      font-weight: 600;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #333;
      display: none; /* 初期状態では非表示 */
    }

    /* クリック時に意味を表示 */
    .word-card.show .japanese {
      display: block;
    }

    .word-card.show {
      border-color: var(--accent-green);
    }
  </style>
</head>
<body>

    <p class="subtitle">カードをクリック（タップ）すると日本語訳が表示・非表示されます</p>
  </header>

        currentUnit = data.unit;
        const titleElement = document.createElement('h2');

</body>
</html>
