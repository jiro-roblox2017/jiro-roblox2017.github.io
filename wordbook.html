<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ワンクリック単語帳</title>
  
  <!-- タブアイコン（ファビコン）設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-work: #0a0a0a;          /* 極黒ダーク背景 */
      --card-bg: #141414;
      --text-main: #ffffff;        /* 完全な白文字 */
      --text-sub: #a0a0a0;         /* 補足用グレー文字 */
      --btn-bg: rgba(255, 255, 255, 0.1);
      --btn-hover: rgba(255, 255, 255, 0.2);
      --accent-orange: #ff6b00;    /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-work);
    }

    /* 固定ヘッダーグループ（他ページと完全共通） */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* メインコンテンツ */
    .flashcard-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 設定切り替えスイッチエリア */
    .setting-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid #262626;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .toggle-btn.active {
      background: var(--accent-orange);
      color: #000000;
      border-color: var(--accent-orange);
    }

    .progress-info {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }

    /* フラッシュカード本体 */
    .card {
      width: 100%;
      max-width: 520px;
      height: 320px;
      background-color: var(--card-bg);
      border: 2px solid #262626;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      position: relative;
      user-select: none;
    }

    .card:hover {
      border-color: var(--accent-orange);
      transform: translateY(-3px);
      background-color: #181818;
    }

    .card-label {
      position: absolute;
      top: 20px;
      left: 24px;
      font-size: 0.8rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .card-content {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
    }

    .card-hint {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
      color: var(--accent-orange);
    }

    /* 前へ・次へ操作ボタン */
    .nav-controls {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .nav-btn {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.6rem 1.8rem;
      font-size: 0.95rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .nav-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-orange);
    }
  </style>
</head>

  <div class="header-group">
    <div class="top-bar">

    <header>

  </div>

  <!-- フラッシュカードエリア -->
  <section class="flashcard-section">

    <div class="setting-panel">
      <button class="toggle-btn active" id="modeBtn" onclick="toggleMode()">モード: 日本語 ➔ 英語</button>
      <button class="toggle-btn" id="orderBtn" onclick="toggleOrder()">順序: 教科書順</button>
    </div>

    <div class="progress-info" id="progressInfo">Unit 4 & 5 (1 / 61)</div>
    
    <div class="card" id="flashcard" onclick="handleCardClick()">
      <div class="card-label" id="cardLabel">日本語訳</div>
      <div class="card-content" id="cardContent">読み込み中...</div>
      <div class="card-hint" id="cardHint">クリックして答えを表示</div>
    </div>

    <div class="nav-controls">
      <button class="nav-btn" onclick="prevCard()">前の単語</button>
      <button class="nav-btn" onclick="nextCard()">次の単語</button>
    </div>
  </section>
