<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ホーム</title>
  
  <!-- タブアイコン（ファビコン）設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-main: #0a0a0a;          /* 極限まで黒に近いダーク背景 */
      --card-bg: #141414;          /* カード背景 */
      --card-hover: #1f1f1f;       /* カードホバー時 */
      --text-main: #ffffff;        /* 完全な白文字 */
      --text-sub: #a0a0a0;         /* 補足用グレー文字 */
      --accent-orange:  #F7971D;    /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- 年齢確認モーダル --- */
    .age-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .age-modal.active {
      display: flex;
    }

    .age-modal-content {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
    }

    .age-modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .age-modal-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .age-btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .age-btn {
      flex: 1;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .age-btn.yes {
      background-color: var(--accent-orange);
      color: #000000;
    }

    .age-btn.no {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .age-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    /* --- 固定ヘッダーグループ --- */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    /* 最上部サブバー（QRコード・このサイトについて・免責事項） */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a, .qr-trigger-btn {
      color: var(--text-sub);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: inherit;
      padding: 0;
      transition: color 0.2s ease;
    }

    .top-bar a:hover, .qr-trigger-btn:hover {
      color: var(--text-main);
    }

    /* QRコード ポップアップモーダル */
    .qr-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }

    .qr-modal.active {
      display: flex;
    }

    .qr-modal-content {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .qr-modal-content img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .qr-close-btn {
      background: var(--accent-orange);
      color: #000;
      border: none;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .qr-close-btn:hover {
      opacity: 0.85;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* メインヘッダー */
    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    /* HUB部分：オレンジ枠 ＋ 黒文字 */
    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* メインコンテンツ */
    main {
      padding: 28px 24px;
      max-width: 1200px;
      margin: 0 auto;
      flex: 1;
      width: 100%;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .video-card {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid transparent;
      padding: 10px;
    }

    .video-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-3px);
      border-color: rgba(255, 107, 0, 0.3);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumbnail-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .video-card:hover .thumbnail-img {
      transform: scale(1.03);
    }

    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: var(--accent-orange);
      color: #ffffff;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 2;
    }

    .video-info {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding: 0 2px;
    }

    .channel-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #1a1a1a;
      border: 1px solid var(--accent-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .details {
      display: flex;
      flex-direction: column;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-card:hover .video-title {
      color: var(--accent-orange-hover);
    }

    .channel-name, .video-stats {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .video-stats {
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- 初回アクセス用 年齢確認モーダル -->
  <div class="age-modal" id="ageModal">
    <div class="age-modal-content">
      <div class="age-modal-title">年齢確認</div>
      <div class="age-modal-desc">あなたは 18 歳以上ですか？</div>
      <div class="age-btn-group">
        <button class="age-btn yes" onclick="verifyAge(true)">はい (Y)</button>
        <button class="age-btn no" onclick="verifyAge(false)">いいえ (N)</button>
      </div>
    </div>
  </div>

  <!-- 共通ヘッダー自動読み込みプレースホルダー -->
  <div id="header-placeholder"></div>

  <main>
    <div class="video-grid" id="cardGrid">
      <!-- JavaScriptでカードが自動生成されます -->
    </div>
  </main>

  <script>
    // --- 共通ヘッダーの自動読み込み ---
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
      });

    // --- 初回アクセス時 年齢確認機能（localStorage対応） ---
    function checkAgeVerification() {
      const isVerified = localStorage.getItem('age_verified');
      if (isVerified !== 'true') {
        document.getElementById('ageModal').classList.add('active');
      }
    }

    function verifyAge(isOver18) {
      if (isOver18) {
        localStorage.setItem('age_verified', 'true');
        document.getElementById('ageModal').classList.remove('active');
      } else {
        localStorage.setItem('age_verified', 'false');
        alert("18歳未満の方はご利用いただけません。");
        window.location.href = "https://www.google.com";
      }
    }

    // --- 共通 QRコードモーダル制御 ---
    function openQrModal() {
      const modal = document.getElementById('qrModal');
      if (modal) modal.classList.add('active');
    }

    function closeQrModal() {
      const modal = document.getElementById('qrModal');
      if (modal) modal.classList.remove('active');
    }

    function closeQrModalOnBg(event) {
      if (event.target.id === 'qrModal') {
        closeQrModal();
      }
    }

    // ==========================================
    // 📂 ページ一覧（ここに増やすだけで勝手にカードになります）
    // ==========================================
    const sitePages = [
      {
        url: "pomodoro.html",
        title: "25分/5分 ポモドーロタイマー【集中＆休憩自動切り替え】",
        category: "タイマー",
        icon: "🍅",
        categoryName: "ワークスペース",
        stats: "いつでも利用可能",
        thumbnail: "25.png"
      },
      {
        url: "excel.html",
        title: "9教科 テスト成績管理・自己採点＆返却点数集計シート",
        category: "学習ツール",
        icon: "📝",
        categoryName: "テスト対策",
        stats: "自動保存対応",
        thumbnail: "excel.png"
      },
      {
        url: "long-pomodoro.html",
        title: "50分/10分 もぎポモドーロタイマー【集中＆休憩自動切り替え】",
        category: "タイマー",
        icon: "📝",
        categoryName: "演習して",
        stats: "タイマー",
        thumbnail: "50.png"
      },
      {
        url: "wordbook.html",
        title: "Unit 4,5単語帳",
        category: "学習ツール",
        icon: "🔠",
        categoryName: "暗記して",
        stats: "タイマー",
        thumbnail: "tango.png"
      },
    {
        url: "https://www.youtube.com",
        title: "YouTube 本家サイトを開く（別タブ）",
        category: "外部",
        icon: "🌐",
        categoryName: "YouTube.com",
        stats: "公式リンク",
        isExternal: true,
        thumbnail: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=600&q=80"
      }, /* ←ここにカンマが必要！ */

      { 
        url: "todo.html", 
        title: "Todoリスト",
        category: "学習ツール", 
        icon: "📋",
        categoryName: "タスク管理",
        stats: "自動保存", 
        thumbnail: "todo.png" 
      }
    ];
     
    const gridContainer = document.getElementById('cardGrid');

    sitePages.forEach(page => {
      const card = document.createElement('a');
      card.href = page.url;
      card.className = 'video-card';
      if (page.isExternal) {
        card.target = '_blank';
      }

      card.innerHTML = `
        <div class="thumbnail-container">
          <img src="${page.thumbnail}" alt="${page.title}" class="thumbnail-img" onerror="this.style.display='none'">
          <div class="duration-badge">${page.category}</div>
        </div>
        <div class="video-info">
          <div class="channel-icon">${page.icon}</div>
          <div class="details">
            <div class="video-title">${page.title}</div>
            <div class="channel-name">${page.categoryName}</div>
            <div class="video-stats">${page.stats}</div>
          </div>
        </div>
      `;

      gridContainer.appendChild(card);
    });

    // 初期化実行
    checkAgeVerification();
  </script>

</body>
</html>
