<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- タブアイコン（ファビコン）設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ホーム</title>
  
  <!-- タブアイコン（ファビコン）の画像名を指定 -->
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    :root {
      --bg-work: #1a365d;      /* 勉強時：落ち着いた深みのある青 */
      --bg-break: #4a121a;     /* 休憩時：ワインレッド */
      --text-color: #ffffff;
      --btn-bg: rgba(255, 255, 255, 0.2);
      --btn-hover: rgba(255, 255, 255, 0.35);
      --input-bg: rgba(255, 255, 255, 0.15);
      --accent-orange: #ff6b00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-color);
      background-color: var(--bg-work);
      transition: background-color 0.8s ease;
    }

    /* 休憩モード時の背景 */
    body.break-mode {
      background-color: var(--bg-break);
    }

    /* ヘッダーグループ（上部バー ＋ メインヘッダー） */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
    }

    /* 上部サブバー */
    .top-bar {
      height: 32px;
      background-color: rgba(5, 5, 5, 0.8);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 24px;
      gap: 16px;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .top-bar a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: #ffffff;
    }

    /* メインヘッダー */
    header {
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    .logo-text span {
      color: var(--accent-orange);
    }

    /* セクション1：タイマーエリア（ヘッダー全体の高さ92pxを引く） */
    .timer-section {
      min-height: calc(100vh - 92px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      text-align: center;
    }

    .status {
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .timer {
      font-size: 6rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      margin-bottom: 2rem;
      letter-spacing: 2px;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button, .link-btn {
      background: var(--btn-bg);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 0.75rem 2rem;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover, .link-btn:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    button:active, .link-btn:active {
      transform: translateY(0);
    }

    /* セクション2：下部の動画＆BGMコントロールエリア */
    .video-section {
      padding: 60px 20px 80px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      background-color: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .video-container {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .video-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* プレイヤー直下の入力・操作パネル */
    .bgm-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      max-width: 720px;
      justify-content: center;
      align-items: center;
    }

    .bgm-input-group {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 280px;
    }

    .bgm-controls input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--text-color);
      padding: 0.75rem 1.2rem;
      border-radius: 30px;
      font-size: 0.95rem;
      outline: none;
    }

    .bgm-controls input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .bgm-controls input:focus {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .bgm-controls button, .bgm-controls .link-btn {
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="header-group">
    <!-- 上部サブバー -->
    <div class="top-bar">
      <a href="about.html">このサイトについて</a>
      <a href="disclaimer.html">免責事項</a>
    </div>

    <!-- メインヘッダー -->
    <header>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">JIRO<span>HUB</span></span>
      </a>

  </div>

  <!-- タイマーエリア（画面を開いた時点ではこれだけが見える） -->
  <section class="timer-section">
