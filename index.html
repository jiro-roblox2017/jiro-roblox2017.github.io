<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIRO HUB - ホーム</title>
  
  <!-- タブアイコン（ファビコン）設定 -->
  <link rel="icon" href="icon.jpg" type="image/jpeg">

  <style>
    :root {
      --bg-main: #0a0a0a;         /* 極限まで黒に近いダーク背景 */
      --card-bg: #141414;         /* カード背景 */
      --card-hover: #1f1f1f;      /* カードホバー時 */
      --text-main: #ffffff;       /* 完全な白文字 */
      --text-sub: #a0a0a0;        /* 補足用グレー文字 */
      --accent-orange: #ff6b00;   /* 鮮やかな差し色オレンジ */
      --accent-orange-hover: #ff8533;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    /* 固定ヘッダーグループ */
    .header-group {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f1f1f;
    }

    /* 最上部サブバー（このサイトについて・免責事項） */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 6px 24px;
      background-color: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.75rem;
    }

    .top-bar a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .top-bar a:hover {
      color: var(--text-main);
    }

    /* メインヘッダー */
    header {
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      color: var(--accent-orange);
      font-size: 1.4rem;
    }

    /* HUB部分：オレンジ枠 ＋ 黒文字 */
    .logo-text span {
      background-color: var(--accent-orange);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
      margin-left: 4px;
      display: inline-block;
      line-height: 1.2;
      font-weight: 900;
    }

    /* メインコンテンツ */
    main {
      padding: 28px 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px 20px;
    }

    .video-card {
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      background-color: var(--card-bg);
      border: 1px solid transparent;
      padding: 10px;
    }

    .video-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-3px);
      border-color: rgba(255, 107, 0, 0.3);
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background-color: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }

    .thumbnail-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .video-card:hover .thumbnail-img {
      transform: scale(1.03);
    }

    .duration-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: var(--accent-orange);
      color: #ffffff;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .video-info {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      padding: 0 2px;
    }

    .channel-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: #1a1a1a;
      border: 1px solid var(--accent-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .details {
      display: flex;
      flex-direction: column;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .video-card:hover .video-title {
      color: var(--accent-orange-hover);
    }

    .channel-name, .video-stats {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .video-stats {
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <!-- 全ページ共通ヘッダーグループ -->
  <div class="header-group">
    <!-- 上部サブバー -->
    <div class="top-bar">
      <a href="about.html">このサイトについて</a>
      <a href="disclaimer.html">免責事項</a>
    </div>

    <!-- メインヘッダー -->
    <header>
      <a href="index.html" class="logo">
        <span class="logo-icon">▶</span>
        <span class="logo-text">JIRO<span>HUB</span></span>
      </a>
    </header>
  </div>

  <main>
    <div class="video-grid">

      <!-- カード 1: ポモドーロタイマー -->
      <a href="pomodoro.html" class="video-card">
        <div class="thumbnail-container">
          <img src="thumbnail1.png" alt="ポモドーロタイマー" class="thumbnail-img">
          <div class="duration-badge">タイマー</div>
        </div>
        <div class="video-info">
          <div class="channel-icon">🍅</div>
          <div class="details">
            <div class="video-title">25分/5分 ポモドーロタイマー【集中＆休憩自動切り替え】</div>
            <div class="channel-name">ワークスペース</div>
            <div class="video-stats">いつでも利用可能</div>
          </div>
        </div>
      </a>

      <!-- カード 2: YouTube公式 -->
      <a href="https://www.youtube.com" target="_blank" class="video-card">
        <div class="thumbnail-container">
          <img src="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=600&q=80" alt="YouTube" class="thumbnail-img">
          <div class="duration-badge">外部</div>
        </div>
        <div class="video-info">
          <div class="channel-icon">🌐</div>
          <div class="details">
            <div class="video-title">YouTube 本家サイトを開く（別タブ）</div>
            <div class="channel-name">YouTube.com</div>
            <div class="video-stats">公式リンク</div>
          </div>
        </div>
      </a>

    </div>
  </main>

</body>
</html>
